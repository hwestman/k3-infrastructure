---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airconnect
  namespace: default
spec:
  # Migrated to the new Talos cluster (2026-09-16).
  replicas: 0
  selector:
    matchLabels:
      app: airconnect
  template:
    metadata:
      labels:
        app: airconnect
    spec:
      hostNetwork: true
      containers:
        - name: airconnect
          image: 1activegeek/airconnect:1.0.8
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: 'Europe/Oslo'
